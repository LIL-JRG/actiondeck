[package]
name = "actiondeck"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# `tauri dev` y `tauri build` arrancan la app; el diagnóstico es aparte.
default-run = "actiondeck"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "actiondeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
chrono = "0.4"
btleplug = "0.13.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
futures = "0.3.34"
uuid = { version = "1.29.0", features = ["v4"] }
ureq = "3.5.0"
dirs = "7.0.0"
zip = { version = "2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
